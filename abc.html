<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC — Alpha Base Camp | Moon Saloon Metrics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0a0f23; color:#ddd; font-family: Georgia, serif; }
    .dashboard { padding: 30px; max-width: 1400px; margin: 0 auto; }
    .card { background:rgba(20,30,60,0.9); border:2px solid #00ffcc; box-shadow:0 0 30px rgba(0,255,204,0.3); }
    table { background:rgba(10,15,35,0.95); }
    th { background:#00ffcc; color:#000; font-weight:bold; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1 class="text-center mb-5" style="color:#00ffcc;">🪐 ALPHA BASE CAMP — LIVE METRICS</h1>
    
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <h4>Unique Visitors</h4>
          <h2 id="unique-count" class="text-warning">0</h2>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <h4>Referral Clicks</h4>
          <h2 id="referral-count" class="text-info">0</h2>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <h4>Total Logs</h4>
          <h2 id="total-logs" class="text-success">0</h2>
        </div>
      </div>
    </div>

    <div class="card mt-4 p-4">
      <h3>Recent Chimes Referral Logs</h3>
      <div class="table-responsive">
        <table class="table table-dark table-striped" id="logs-table">
          <thead>
            <tr><th>Time</th><th>Event</th><th>Target</th><th>Page</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    console.log("ABC Dashboard v2 Loaded - Waiting for Firebase data...");
    // Add your Firebase initialization + query code here
  </script>
</body>
</html>
